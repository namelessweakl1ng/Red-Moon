[package]
name = "red-moon"
version = "0.1.0"
edition = "2021"
description = "An offline encrypted password vault"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
red-moon-core = { path = "../crates/red-moon-core" }
serde_json = "1"
secrecy = "0.8"
arboard = { version = "3", default-features = false }
[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
